name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # NOTE: this frontend has no unit test suite yet (no vitest/jest
      # configured, no test files found). Lint is used as the interim
      # automated gate so Deploy is still genuinely blocked on a real CI
      # check, not a no-op. Recommend adding vitest (see DocuVault's
      # src/lib/roles.test.js for a working pattern) as a follow-up.
      - run: npm run lint

  deploy:
    name: Deploy (Vercel)
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Overrides the workflow-level `working-directory: frontend` default.
    # The linked Vercel project's own Root Directory setting is already
    # "frontend" (pulled in via `vercel pull` below), and the Vercel CLI
    # resolves that setting relative to cwd. Running these steps from
    # frontend/ too would resolve it a second time (frontend/frontend,
    # which doesn't exist) - so these steps run from the repo root and
    # let Vercel's own project config be the single source of truth.
    defaults:
      run:
        working-directory: .
    env:
      # Required so `vercel pull` can link to the existing Vercel project
      # non-interactively — there is no .vercel/project.json checked into
      # this repo (Vercel's own Git integration created the project).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
      # If Vercel's own Git integration auto-deploy is still enabled for this
      # repo, disable it (Vercel Project Settings > Git) so this test-gated
      # workflow is the sole deploy path and you don't get duplicate deploys.
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
